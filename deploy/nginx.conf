server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Vite build assets are content-hashed, so they can be cached hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # API traffic goes to the Node container on the compose network.
  location /api/ {
    proxy_pass http://api:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /health {
    proxy_pass http://api:3001/health;
  }

  # Client-side routing: every unknown path renders the SPA shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
