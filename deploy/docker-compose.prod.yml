# Yunto production stack — one box, three containers.
#   nginx :80  → serves the built SPA, proxies /api to the API container
#   api        → Node + Express + Prisma
#   db         → Postgres 16, volume-backed
#
# Bring up with:  docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yunto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-yunto}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yunto}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Not published to the host: only reachable on the compose network.
    expose:
      - "5432"

  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-yunto}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-yunto}?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in .env}
      SEED_ON_BOOT: ${SEED_ON_BOOT:-false}
      HOST: 0.0.0.0
      PORT: 3001
      # S3 uploads. Optional: with S3_BUCKET empty the upload routes answer 501
      # and the server still boots. Credentials come from the EC2 instance role,
      # so no keys are passed here.
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
    expose:
      - "3001"

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    # No host port: Caddy is the only thing the internet talks to now. nginx is
    # reachable only on the compose network, as `web:80`.
    expose:
      - "80"
    volumes:
      # The SPA is built on the host (or in CI) and mounted in — keeps the
      # image generic and makes redeploying the frontend a file copy.
      - ../web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # HTTPS terminator. Caddy fetches and renews a real Let's Encrypt certificate
  # for the nip.io hostname automatically (nip.io resolves *.<ip>.nip.io to the
  # IP, so no domain purchase is needed), then reverse-proxies to nginx. This is
  # what lets a browser — which force-upgrades http to https — actually load the
  # site; plain :80 alone left every browser hitting a closed :443.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_HOST: ${SITE_HOST:?set SITE_HOST in .env, e.g. 13.202.99.173.nip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
